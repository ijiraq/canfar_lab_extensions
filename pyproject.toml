[build-system]
requires = [
    "hatchling>=1.21",
    "jupyterlab>=4.0.0,<5",
    "hatch-jupyter-builder>=0.9.1",
]
build-backend = "hatchling.build"

[project]
name = "canfar_lab_extensions"
version = "0.1.2"
description = "CANFAR JupyterLab extensions: Firefly launcher and Tutorials menu"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "JJ Kavelaars", email = "jj.kavelaars@nrc-cnrc.gc.ca" }]
keywords = ["jupyter", "jupyterlab", "jupyterlab-extension", "canfar", "firefly", "rubin"]
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "jupyter_server>=2.0.1,<3",
    "tornado>=6.0",
    # Skaha client used to create/reuse the Firefly session.
    "canfar>=1.0",
]

[project.urls]
Homepage = "https://github.com/ijiraq/canfar_lab_extensions"
Repository = "https://github.com/ijiraq/canfar_lab_extensions"
Issues = "https://github.com/ijiraq/canfar_lab_extensions/issues"

[tool.hatch.build.targets.wheel.shared-data]
"canfar_lab_extensions/labextension" = "share/jupyter/labextensions/canfar_lab_extensions"
"install.json" = "share/jupyter/labextensions/canfar_lab_extensions/install.json"
"jupyter-config/server-config/canfar_lab_extensions.json" = "etc/jupyter/jupyter_server_config.d/canfar_lab_extensions.json"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.9.1"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "canfar_lab_extensions/labextension/package.json",
    "canfar_lab_extensions/labextension/static/style.js",
]
# If the labextension was already built (CI runs `jlpm build:prod` first),
# don't re-run npm inside pip's isolated build environment.
skip-if-exists = [
    "canfar_lab_extensions/labextension/package.json",
    "canfar_lab_extensions/labextension/static/style.js",
]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]
path = "."

[tool.hatch.build.targets.sdist]
artifacts = ["canfar_lab_extensions/labextension"]
exclude = [".github", "**/node_modules", "**/.venv", "**/.yarn"]

[tool.hatch.build.targets.wheel]
artifacts = ["canfar_lab_extensions/labextension"]
