name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build "jupyterlab>=4,<5" hatchling hatch-jupyter-builder

      - name: Build labextension
        run: |
          jlpm install
          jlpm run build:prod

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install "jupyterlab>=4,<5" dist/*.whl
          /tmp/smoke/bin/jupyter-server extension list 2>&1 | tee ext.txt
          grep -q "canfar_lab_extensions.*enabled" ext.txt
          /tmp/smoke/bin/jupyter-labextension list 2>&1 | tee lab.txt
          grep -q "canfar_lab_extensions.*enabled.*OK" lab.txt
          /tmp/smoke/bin/python -c "import canfar_lab_extensions, canfar.sessions; print(canfar_lab_extensions.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
